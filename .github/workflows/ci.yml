name: ci
on: [push, pull_request]
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck
      - run: shellcheck -S warning runner.sh
      - run: bash -n runner.sh
      # config.env files are sourced by bash; they must at least parse.
      - run: for f in agents/*/config.env; do bash -n "$f"; done
